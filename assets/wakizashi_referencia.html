const FS=`precision highp float;
uniform vec2 uR,uP,uFoc,uBc,uBd,uSc;uniform float uF,uT,uE,uK,uDim,uHit,uShock,uBl,uBi,uBg;
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*f*(f*(f*6.-15.)+10.);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}

let GL=null,GU={};

// a velocidade do fundo segue a musica: tempo de fluxo acumulado pelos picos
const PK=f=>{let v=0,n=0;for(let i=-4;i<=4;i++){const x=typeof PEAKS!='undefined'?PEAKS[f+i]:null;if(x!=null){v+=x;n++}}return n?v/n:.2};
const FLOW=[0];for(let f=1;f<NF+60;f++)FLOW[f]=FLOW[f-1]+(.42+1.5*PK(f))/30;
const HITS=[[9.92,1],[16.78,.34],[22.92,.4],[31.16,.34]];

const FOC=[[0,.98,.68],[2.85,.9,.72],[4.05,1.05,.45],[6.05,.98,.52],[8.3,.89,.5],[10.85,.75,.52],[15.4,.89,.62],[17.6,.6,.62],[19.3,1.2,.42],[20.2,.95,.72],[21.6,.89,.5],[23.2,.89,.72],[27.3,.89,.6],[28.6,.89,.45]];

 const th=T-BL.h,gr=eio(P(T,8.34,9.62));let bl=0,bi=0,bg=0;

function wrap(sc,html){const TR=.24,e=eio(P(T,sc.s,sc.s+TR)),x=eio(P(T,sc.e-.02,sc.e+TR-.02));const[dx,dy]=sc.dir||[1,0],A=sc.a3??1;
